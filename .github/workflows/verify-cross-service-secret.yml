name: verify-cross-service-secret

on:
  workflow_dispatch:

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Print secret fingerprint
        env:
          CROSS_SERVICE_SECRET: ${{ secrets.CROSS_SERVICE_SECRET }}
        run: |
          printf '%s' "$CROSS_SERVICE_SECRET" | sha256sum
          printf 'byte-length: %s\n' "${#CROSS_SERVICE_SECRET}"
