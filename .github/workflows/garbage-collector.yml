name: Garbage Collector

on:
  schedule:
    - cron: '0 6 * * *'   # daily 06:00 UTC — dry-run report to issue #178
    - cron: '0 6 * * 1'   # Monday 06:00 UTC — full sweep (DRY_RUN=false)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — report findings only, open no PRs or Issues (recommended for first 3–5 days)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
      days_branch:
        description: 'Days before a branch is considered stale'
        required: false
        default: '90'
      days_comment:
        description: 'Days before a TODO/FIXME comment is flagged'
        required: false
        default: '180'

concurrency:
  group: garbage-collector
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN:     ${{ secrets.GC_BOT_TOKEN }}
      DRY_RUN:      ${{ github.event.inputs.dry_run || (github.event.schedule == '0 6 * * 1' && 'false') || 'true' }}
      DAYS_BRANCH:  ${{ github.event.inputs.days_branch  || '90' }}
      DAYS_COMMENT: ${{ github.event.inputs.days_comment || '180' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history required for git blame and branch age
          token: ${{ secrets.GC_BOT_TOKEN }}   # PAT so pushed branches trigger CI

      - name: Configure git user
        run: |
          git config user.name 'WorldWideView GC Bot'
          git config user.email 'gc-bot@users.noreply.github.com'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic scan
        run: |
          node scripts/gc-scan.mjs \
            --out gc-findings.json \
            --days-branch=${{ env.DAYS_BRANCH }} \
            --days-comment=${{ env.DAYS_COMMENT }}

      - name: Upload findings artifact
        uses: actions/upload-artifact@v7
        with:
          name: gc-findings-${{ github.run_id }}
          path: gc-findings.json
          retention-days: 30

      - name: Run Garbage Collector agent
        uses: anomalyco/opencode/github@v1.18.11
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Headless CI: pre-approve external_directory so the agent never hangs on an
          # unanswerable permission prompt (anomalyco/opencode#14473). CI-only, no repo config change.
          OPENCODE_PERMISSION: '{"external_directory": "allow"}'
        with:
          model: deepseek/deepseek-v4-flash
          use_github_token: true
          share: false
          prompt: |
            You are the WorldWideView Garbage Collector agent running headless in GitHub Actions.

            Read `.agents/rules/garbage-collection.md` for your charter and all guard rails.
            Read `gc-findings.json` for the pre-scanned findings produced by `scripts/gc-scan.mjs`.

            The DRY_RUN environment variable is: ${{ env.DRY_RUN }}

            ## If DRY_RUN is "true":
            Do NOT create any PRs or Issues.
            Instead, find or create the tracking Issue titled "[gc-bot] Daily Scan Reports" (label: gc-bot) in
            the ${{ github.repository }} repository using the gh CLI:

              # Find existing tracking issue
              gh issue list --repo ${{ github.repository }} --label gc-bot --search "[gc-bot] Daily Scan Reports" --json number,title

              # If it exists, add a comment:
              gh issue comment <number> --repo ${{ github.repository }} --body "..."

              # If it doesn't exist, create it:
              gh issue create --repo ${{ github.repository }} --title "[gc-bot] Daily Scan Reports" --label gc-bot --body "..."

            The comment body must list every finding with: tier, file, line, description.
            Include the run ID (${{ github.run_id }}) and timestamp at the top.

            ## Report-dedup rule (dry-run):
            Before posting, compare the current scan against the previous report comment on the tracking Issue.
            Read the last comment with (comments are returned oldest-first, so [-1] is the most recent):
              gh api repos/${{ github.repository }}/issues/<number>/comments?per_page=100 --jq '.[-1].body'
            - If the previous report's findings are identical to the current scan (same finding count,
              same file + type sets), post NOTHING — or at most a one-line "No changes since <previous-date>."
              ONLY if the previous report comment is more than 7 days old.
            - If findings changed materially (new findings, resolved findings, or changed counts), post the
              full report.
            - The Monday full sweep (DRY_RUN=false) always posts a full digest regardless.

            ## If DRY_RUN is "false":
            Execute the full sweep procedure described in `.agents/agents/garbage-collector.md`.
            Create Tier A draft PRs and Tier B Issues per the guard rails in `.agents/rules/garbage-collection.md`.

            Do not scan the codebase yourself. Work only from gc-findings.json.
