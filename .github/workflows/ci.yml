name: CI

# CLI-only changes are covered by cli.yml; skip the full app suite for them.
# Docs/agent-rules/issue-template changes also skip the suite.
on:
  push:
    branches: [main]
    paths-ignore:
      - "packages/wwv-cli/**"
      - ".agents/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/gc/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "packages/wwv-cli/**"
      - ".agents/**"
      - "**/*.md"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/gc/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Non-blocking dependency audit. Surfaces high / critical vulnerabilities
  # in the CI output without failing the build. Flip `continue-on-error` to
  # `false` once the current transitive vulns (see #97) are resolved.
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high || true

  ascii-lint:
    name: ASCII Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check for non-ASCII bytes in workflow files, yaml files, and shell scripts
        run: |
          exit_code=0
          for pattern in '.github/workflows/*.yml' '**/*.yml' '**/*.yaml' '**/*.sh'; do
            while IFS= read -r -d '' f; do
              if grep -Pl '[^\x00-\x7F]' "$f" 2>/dev/null; then
                echo "::error file=$f,title=Non-ASCII::Non-ASCII bytes detected in $f"
                exit_code=1
              fi
            done < <(find . -path './node_modules' -prune -o -path './.git' -prune -o -path './dist' -prune -o -path './.next' -prune -o -name "$pattern" -print0)
          done
          exit $exit_code

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: pnpm exec tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      - name: Check demo edition route gates
        run: pnpm check:demo-gates

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @worldwideview/wwv-plugin-sdk build
      - run: npx prisma generate
      - run: pnpm exec vitest run --coverage || true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./coverage
          fail_ci_if_error: false

      - name: Coverage report comment
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@v2

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [typecheck, test]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-in-tests
      NEXT_PUBLIC_WWV_EDITION: local
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - name: Verify migrations cover the schema
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema prisma/schema.prisma --exit-code
      - run: pnpm build

  docker-build:
    name: Docker Build (local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build local edition image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          build-args: |
            NEXT_PUBLIC_WWV_EDITION=local
            NEXT_PUBLIC_CESIUM_ION_TOKEN=
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=
            NEXT_PUBLIC_BING_MAPS_KEY=
            NEXT_PUBLIC_WS_ENGINE_URL=
            NEXT_PUBLIC_WWV_PLUGIN_DATA_ENGINE_URL=
          cache-from: type=gha,scope=ci-docker-local
          cache-to: type=gha,scope=ci-docker-local,mode=max
