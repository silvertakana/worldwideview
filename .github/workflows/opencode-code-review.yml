name: OpenCode Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opencode-review:
    if: contains('["OWNER","MEMBER","COLLABORATOR"]', github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Dismiss prior bot reviews
        uses: actions/github-script@v7
        with:
          script: |
            const { data: reviews } = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            for (const r of reviews) {
              if (r.user && r.user.login === 'github-actions[bot]' && r.state === 'COMMENTED') {
                try {
                  await github.rest.pulls.dismissReview({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: context.issue.number,
                    review_id: r.id,
                    message: 'Superseded by the latest automated review.'
                  });
                } catch (e) { console.log('skip review ' + r.id + ': ' + e.message); }
              }
            }

      - name: Run OpenCode Code Review
        uses: anomalyco/opencode/github@v1.18.11
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Headless CI: pre-approve external_directory so the agent never hangs on an
          # unanswerable permission prompt (anomalyco/opencode#14473). CI-only, no repo config change.
          OPENCODE_PERMISSION: '{"external_directory": "allow"}'
        with:
          model: deepseek/deepseek-v4-flash
          use_github_token: true
          share: false
          prompt: |
            You are a code reviewer for the WorldWideView repository (${{ github.repository }}).
            The current PR is #${{ github.event.pull_request.number }} and its changes are checked out in the workspace.

            Review the changed files for:
            - Bugs and edge cases
            - Security issues
            - Code quality and maintainability
            - Adherence to project conventions (see AGENTS.md and CLAUDE.md in the repo root)

            Review the changes in this PR and post your findings as a PR review comment via gh CLI. Prior stale bot reviews are dismissed automatically by the workflow.

            Post your review as a PR review comment:
              gh pr review ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --comment --body "<your findings>"
