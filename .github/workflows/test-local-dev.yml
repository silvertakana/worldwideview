name: Test Local Dev Environment

on:
  push:
    branches: [main]
    paths-ignore:
      - "packages/wwv-cli/**"
  pull_request:
    branches: [main]
    paths:
      - "scripts/setup.mjs"
      - "scripts/boot-db.mjs"
      - ".env.example"
      - "package.json"
      - ".github/workflows/test-local-dev.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs on all 3 OS — tests the actual pnpm setup command users run
  test-setup:
    name: pnpm setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm setup
        run: pnpm run setup

      - name: Verify .env.local was created (not .env)
        shell: bash
        run: |
          if [ ! -f .env.local ]; then
            echo "FAIL: .env.local was not created by pnpm setup"
            exit 1
          fi
          echo "PASS: .env.local exists"

          # Regression guard: BETTER_AUTH_SECRET must NOT be in the git-tracked .env
          if [ -f .env ] && grep -qE "^BETTER_AUTH_SECRET=[a-f0-9]{10}" .env; then
            echo "FAIL: BETTER_AUTH_SECRET was written to .env (git-tracked) instead of .env.local"
            exit 1
          fi
          echo "PASS: .env does not contain a generated BETTER_AUTH_SECRET"

      - name: Verify BETTER_AUTH_SECRET generated correctly
        shell: bash
        run: |
          if ! grep -qE "^BETTER_AUTH_SECRET=[a-f0-9]{64}$" .env.local; then
            echo "FAIL: BETTER_AUTH_SECRET missing or wrong format in .env.local"
            grep "BETTER_AUTH_SECRET" .env.local || echo "(BETTER_AUTH_SECRET line not found)"
            exit 1
          fi
          echo "PASS: BETTER_AUTH_SECRET is 64-char hex"

      - name: Verify ENCRYPTION_MASTER_KEY generated correctly
        shell: bash
        run: |
          if ! grep -qE "^ENCRYPTION_MASTER_KEY=[a-f0-9]{64}$" .env.local; then
            echo "FAIL: ENCRYPTION_MASTER_KEY missing or wrong format in .env.local"
            exit 1
          fi
          echo "PASS: ENCRYPTION_MASTER_KEY is 64-char hex"

      - name: Verify idempotency (re-run must skip gracefully)
        shell: bash
        run: |
          output=$(pnpm run setup 2>&1)
          echo "$output"
          if echo "$output" | grep -q "already exists"; then
            echo "PASS: second run skipped gracefully"
          else
            echo "FAIL: re-run did not skip"
            exit 1
          fi

  # Linux-only: full predev + dev server smoke test (requires Docker)
  test-dev:
    name: pnpm dev smoke test (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_WWV_EDITION: local
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Create coolify docker network
        run: docker network create coolify || true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm setup
        run: pnpm run setup

      - name: Run predev (Docker DB + Prisma + Cesium + plugins)
        run: pnpm run predev

      - name: Start dev server and wait for ready
        run: |
          pnpm run dev &
          DEV_PID=$!
          echo "Waiting for Next.js on :3000 (up to 120s)..."
          timeout 120 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 5; done'
          if ! kill -0 $DEV_PID 2>/dev/null; then
            echo "FAIL: dev server crashed before responding"
            exit 1
          fi
          echo "PASS: dev server responded on :3000"
          kill $DEV_PID

  # Linux-only: guards the boot-db.mjs startup failure paths. Needs no dependencies
  # and starts no container: the compose case fails while reading a COMPOSE_FILE that
  # does not exist, so Docker never creates anything.
  test-boot-db-failures:
    name: boot-db failure paths (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Docker CLI unavailable — stops with a clear reason and non-zero exit
        shell: bash
        run: |
          set -u
          workdir="$(mktemp -d)"
          cp .env.example "$workdir/.env.example"
          mkdir -p "$workdir/shim"
          {
            echo '#!/bin/sh'
            echo 'echo "docker-shim: no docker on this host" >&2'
            echo 'exit 127'
          } > "$workdir/shim/docker"
          chmod +x "$workdir/shim/docker"

          # Prepend the shim rather than rewriting PATH with external tools: it wins
          # over any real docker, and grep/sed stay usable for later assertions. The
          # COMPOSE_FILE guard means a shim that was ever bypassed still aborts before
          # compose can create a container.
          status=0
          output="$(cd "$workdir" && PATH="$workdir/shim:${PATH}" COMPOSE_FILE="$workdir/does-not-exist.yml" node "$GITHUB_WORKSPACE/scripts/boot-db.mjs" 2>&1)" || status=$?
          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            echo "FAIL: boot-db.mjs exited 0 with no usable Docker CLI"
            exit 1
          fi
          if [[ "$output" != *"Docker is unreachable"* ]]; then
            echo "FAIL: boot-db.mjs did not report that Docker is unreachable"
            exit 1
          fi
          if [[ "$output" != *"docker-shim: no docker on this host"* ]]; then
            echo "FAIL: boot-db.mjs did not quote the real docker error"
            exit 1
          fi
          echo "PASS: exit $status with a real diagnostic"

      - name: Compose cannot start the database — stops with a non-zero exit
        shell: bash
        run: |
          set -u
          workdir="$(mktemp -d)"
          cp .env.example "$workdir/.env.example"

          if ! docker --version; then
            echo "FAIL: docker CLI unavailable on this runner, so the compose path cannot be exercised"
            exit 1
          fi

          # COMPOSE_FILE points at a path that does not exist, so compose aborts while
          # reading the file and never creates a container.
          status=0
          output="$(cd "$workdir" && COMPOSE_FILE="$workdir/does-not-exist.yml" node "$GITHUB_WORKSPACE/scripts/boot-db.mjs" 2>&1)" || status=$?
          printf '%s\n' "$output"

          if [ "$status" -eq 0 ]; then
            echo "FAIL: boot-db.mjs exited 0 after compose failed to start the database"
            exit 1
          fi
          if [[ "$output" != *"Failed to start"* ]]; then
            echo "FAIL: boot-db.mjs did not report the compose failure"
            exit 1
          fi
          if [[ "$output" == *"Local PostgreSQL database is ready"* ]]; then
            echo "FAIL: boot-db.mjs claimed the database was ready"
            exit 1
          fi
          echo "PASS: exit $status after compose failed"

