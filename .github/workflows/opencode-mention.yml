name: OpenCode Mention

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  opencode:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Build mention context prompt
        id: prompt
        uses: actions/github-script@v7
        with:
          script: |
            const commentBody = context.payload.comment?.body ||
              context.payload.review?.body || '';
            const issue = context.payload.issue;
            const pr = context.payload.pull_request;
            const number = issue?.number || pr?.number || '';
            const repo = context.repo.owner + '/' + context.repo.repo;
            core.setOutput('prompt', [
              'Repository: ' + repo,
              number ? ('Conversation: issue/PR #' + number) : '',
              '',
              '## Triggering message',
              commentBody || '(no message body)',
              '',
              '## Instruction',
              'Respond to the mention above by posting a helpful comment on ' +
                (number ? ('issue/PR #' + number + ' of ' + repo) : repo) +
                ' using the gh CLI: gh issue comment ' + number + ' --repo ' + repo + ' --body "..."',
              '',
              'You have read-only access to repository content. Do not create branches, commits, or PRs.',
              'If the request asks for code changes, explain what would need to change and ask for approval.'
            ].filter(Boolean).join('\n'));

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run OpenCode
        uses: anomalyco/opencode/github@v1.17.13
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: deepseek/deepseek-v4-flash
          use_github_token: true
          share: false
          prompt: ${{ steps.prompt.outputs.prompt }}
